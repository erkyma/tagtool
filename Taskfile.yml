version: '3'

tasks:
  test:
    cmds:
      - go test ./...

  build:
    cmds:
      - go build -o bin/tagtool .

  install:
    desc: Install tagtool into GOPATH/bin
    cmds:
      - go install .

  shell:
    desc: Add the tt alias and zsh completion to ~/.zshrc (once)
    cmds:
      - for: ['alias tt=tagtool', 'source <(tagtool completion zsh)']
        cmd: grep -qxF '{{.ITEM}}' ~/.zshrc || echo '{{.ITEM}}' >> ~/.zshrc
